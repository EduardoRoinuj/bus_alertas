# Blueprint do Render (plano gratuito). Ver DEPLOY.md
services:
  - type: web
    name: bus-alertas
    runtime: python
    plan: free
    rootDir: server
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    # 1 worker (o estado ao vivo fica em memória) + threads para pedidos simultâneos
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 30 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: API_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
